# /opt/streaming/nginx/conf.d/gongbulab.conf
#
# 3 subdomains routés vers nos containers locaux :
#   gongbulab.lewe.fr        → web (Next.js)  :13300
#   gongbulab-api.lewe.fr    → api (FastAPI)  :13301
#   gongbulab-supa.lewe.fr   → Supabase Kong  :13302
#
# Les certs Let's Encrypt sont émis par stream_certbot via DNS Cloudflare challenge.
# Pour ajouter ce fichier :
#   sudo cp deploy/nginx/gongbulab.conf /opt/streaming/nginx/conf.d/
#   docker exec stream_nginx nginx -t
#   docker exec stream_nginx nginx -s reload

# ─── web ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name gongbulab.lewe.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gongbulab.lewe.fr;

    ssl_certificate     /etc/letsencrypt/live/gongbulab.lewe.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gongbulab.lewe.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin;

    location / {
        proxy_pass         http://172.18.0.1:13300;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ─── api ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name gongbulab-api.lewe.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gongbulab-api.lewe.fr;

    ssl_certificate     /etc/letsencrypt/live/gongbulab-api.lewe.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gongbulab-api.lewe.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # Stripe webhooks ne supportent pas le 301 redirect — on traite ici sans forcer HTTPS
    location / {
        proxy_pass         http://172.18.0.1:13301;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ─── supabase ───────────────────────────────────────────────────────
server {
    listen 80;
    server_name gongbulab-supa.lewe.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gongbulab-supa.lewe.fr;

    ssl_certificate     /etc/letsencrypt/live/gongbulab-supa.lewe.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gongbulab-supa.lewe.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 50m;  # storage uploads

    # Pas de redirect 301 — Supabase Realtime utilise des WebSockets
    location / {
        proxy_pass         http://172.18.0.1:13302;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
