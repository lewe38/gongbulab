# /opt/streaming/nginx/conf.d/gongbulab.conf
#
# 3 subdomains routés vers nos containers via le network `streaming_stream_net`
# (auquel nos containers gongbulab-web-1 et gongbulab-api-1 sont rattachés).
# Les services sont accessibles par nom : gongbulab-web-1:3000, gongbulab-api-1:8000,
# gongbulab-supabase-kong-1:8000 (network gongbulab-supabase_default — attaché aussi
# à stream_nginx si besoin, sinon on l'attache à la volée avec un docker network connect).

# Pour kong on attache stream_nginx au network supabase aussi.

# ─── web ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name gongbulab.lewe.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gongbulab.lewe.fr;

    ssl_certificate     /etc/letsencrypt/live/gongbulab.lewe.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gongbulab.lewe.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin;

    location / {
        proxy_pass         http://gongbulab-web-1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

# ─── api ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name gongbulab-api.lewe.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gongbulab-api.lewe.fr;

    ssl_certificate     /etc/letsencrypt/live/gongbulab-api.lewe.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gongbulab-api.lewe.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://gongbulab-api-1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ─── supabase (kong) ────────────────────────────────────────────────
server {
    listen 80;
    server_name gongbulab-supa.lewe.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
