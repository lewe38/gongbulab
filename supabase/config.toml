# Config Supabase CLI — utilisé par `pnpm dlx supabase start` en local
# Doc : https://supabase.com/docs/guides/cli/config

project_id = "gongbulab"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false  # désactivé en dev pour signup rapide

[storage]
enabled = true
file_size_limit = "50MiB"

[inbucket]
enabled = true
port = 54324  # mail catcher local pour tester signup/reset
